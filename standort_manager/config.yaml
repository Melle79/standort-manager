name: Standort-Manager
version: "0.3.1"
slug: standort_manager
description: Standortverfolgung für Apple-Geräte mit eigener Oberfläche, Zonen, Adressauflösung und Ankunftszeiten
url: https://github.com/Melle79/standort-manager
arch:
  - aarch64
  - amd64
  - armv7
init: false
ingress: true
ingress_port: 8097
panel_icon: mdi:map-marker-account
panel_title: Standort
map:
  - config:rw
homeassistant_api: true
auth_api: true
services:
  - mqtt:want
options:
  mqtt_enabled: true
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  entity_praefix: "standort"
  log_level: "info"
schema:
  mqtt_enabled: bool
  mqtt_host: str?
  mqtt_port: port?
  mqtt_user: str?
  mqtt_password: password?
  entity_praefix: str
  log_level: list(debug|info|warning|error)
